# Broker MQTT para el laboratorio WSN.
# Escucha en todas las direcciones (IPv4 e IPv6). Los motes simulados llegan
# por fd00::1 (interfaz tun0 creada por tunslip6); el host por localhost:1883.
listener 1883 0.0.0.0
listener 1883 ::
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type all
