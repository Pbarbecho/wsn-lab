# Laboratorio de Redes de Sensores Inalámbricos (WSN) - Contiki-NG / Cooja
#
# Servicios:
#   contiki-init -> se ejecuta una vez al arrancar: clona Contiki-NG (+ submódulos Cooja, etc.)
#                   en el volumen "wsn-contiki-ng" y ajusta permisos. Sustituye al antiguo setup.sh.
#   cooja        -> imagen oficial contiker/contiki-ng + escritorio virtual VNC/noVNC (services/vnc/Dockerfile).
#                   Cooja se ve en el navegador (http://localhost:6080) o con un cliente VNC (localhost:5901);
#                   no hace falta servidor X11 en el host.
#   mosquitto    -> broker MQTT. Comparte la pila de red del contenedor cooja para que
#                   los motes simulados lo alcancen en fd00::1 a través del border router (tunslip6).
#   nodered      -> panel/flow para visualizar los datos MQTT (http://localhost:1880)
#
# Uso (no hace falta ningún script previo):
#   docker compose up -d       # la 1.ª vez clona Contiki-NG, descarga y construye las imágenes (~5-10 min)
#   ./scripts/vnc-viewer.sh    # abre el visor en el navegador (http://localhost:6080)
#   ./scripts/cooja-gui.sh     # lanza Cooja dentro del escritorio virtual
#   ./scripts/shell.sh         # terminal dentro del contenedor
#
# Configuración opcional en .env (ver .env.example): LOCAL_UID/LOCAL_GID, VNC_*, CNG_TAG.

name: wsn-lab

services:
  contiki-init:
    image: alpine/git:latest
    container_name: wsn-init
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        git config --global --add safe.directory '*'
        git config --global core.autocrlf false
        if [ -f /contiki-ng/.wsn-init-done ]; then
          echo "[init] Contiki-NG ya está preparado ($$(git -C /contiki-ng describe --always --tags 2>/dev/null))"
          exit 0
        fi
        if [ ! -d /contiki-ng/.git ]; then
          echo "[init] Clonando Contiki-NG ($$CNG_TAG)..."
          git clone --branch "$$CNG_TAG" https://github.com/contiki-ng/contiki-ng.git /contiki-ng
        fi
        echo "[init] Submódulos (Cooja, motelist, cc2538-bsl, mbedtls, micro-ecc)..."
        git -C /contiki-ng submodule update --init --recursive \
          tools/cooja tools/motelist tools/cc2538-bsl os/net/security/mbedtls os/net/security/micro-ecc
        chown -R "$$LOCAL_UID:$$LOCAL_GID" /contiki-ng /gradle
        touch /contiki-ng/.wsn-init-done
        echo "[init] Listo."
    environment:
      - CNG_TAG=${CNG_TAG:-develop}
      - LOCAL_UID=${LOCAL_UID:-1000}
      - LOCAL_GID=${LOCAL_GID:-1000}
    volumes:
      - contiki-ng:/contiki-ng
      - gradle-cache:/gradle
    restart: "no"

  cooja:
    build:
      context: ./services/vnc
    image: wsn-lab/cooja-vnc:latest
    # contiker/contiki-ng solo se publica para amd64. En Mac Apple Silicon (arm64) corre emulada
    # (active "Use Rosetta for x86_64/amd64 emulation" en Docker Desktop para mayor velocidad).
    platform: linux/amd64
    container_name: wsn-cooja
    hostname: wsn-cooja
    # tunslip6 crea una interfaz TUN dentro del contenedor (práctica 5 en adelante)
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv6.conf.default.disable_ipv6=0
      - net.ipv6.conf.all.forwarding=1
    environment:
      # Escritorio virtual (Xtigervnc) en :1 -> VNC 5901, noVNC 6080
      - DISPLAY=:1
      - VNC_GEOMETRY=${VNC_GEOMETRY:-1600x900}
      - VNC_PASSWORD=${VNC_PASSWORD:-}
      - COOJA_AUTOSTART=${COOJA_AUTOSTART:-0}
      # remap-user.sh (entrypoint de la imagen) cambia el uid/gid del usuario "user"
      # para que los archivos creados en los volúmenes pertenezcan a tu usuario del host.
      - LOCAL_UID=${LOCAL_UID:-1000}
      - LOCAL_GID=${LOCAL_GID:-1000}
      - GRADLE_USER_HOME=/home/user/.gradle
      # caché de ccache fuera de ~/.cache (que puede quedar con dueño root): evita "ccache: Permission denied"
      - CCACHE_DIR=/home/user/.ccache
      - JAVA_TOOL_OPTIONS=-Dawt.useSystemAAFontSettings=on
    volumes:
      - ./:/home/user/wsn-lab
      - contiki-ng:/home/user/contiki-ng      # volumen: rápido en Windows/macOS y sin problemas de CRLF
      # el mismo volumen, visible también en wsn-lab/contiki-ng: así funciona el CONTIKI = ../../contiki-ng
      # de los Makefile de practicas/ (en su carpeta aparece solo una carpeta vacía, ignorada por git)
      - contiki-ng:/home/user/wsn-lab/contiki-ng
      - gradle-cache:/home/user/.gradle
    working_dir: /home/user/wsn-lab
    depends_on:
      contiki-init:
        condition: service_completed_successfully
    ports:
      - "6080:6080"   # noVNC: visor de Cooja en el navegador
      - "5901:5901"   # VNC nativo (RealVNC, TigerVNC, Remmina...)
      - "1883:1883"   # Mosquitto (comparte red con este contenedor)
      - "1880:1880"   # Node-RED
    stdin_open: true
    tty: true
    command: ["/usr/local/bin/start-vnc.sh"]
    healthcheck:
      test: ["CMD-SHELL", "test -e /tmp/.X11-unix/X1"]
      interval: 10s
      timeout: 3s
      retries: 6

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: wsn-mosquitto
    network_mode: "service:cooja"
    depends_on:
      - cooja
    volumes:
      - ./services/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    restart: unless-stopped

  nodered:
    image: nodered/node-red:latest
    container_name: wsn-nodered
    network_mode: "service:cooja"
    depends_on:
      - cooja
      - mosquitto
    volumes:
      - ./services/nodered:/data
    restart: unless-stopped

volumes:
  mosquitto-data:
  contiki-ng:
    name: wsn-contiki-ng
  gradle-cache:
    name: wsn-gradle-cache
